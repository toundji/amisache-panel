<div class="container-fluid px-0">

  <div class="page-header">
    <div class="d-flex align-items-center gap-3">
      <app-back-button fallback="/clergy-members"></app-back-button>
      <div>
        <h1 class="page-title mb-0">Nouvelle affectation</h1>
        <p class="page-subtitle mb-0">Le membre et l'entité ne pourront plus être modifiés après création (créer une nouvelle affectation pour un changement d'entité)</p>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-8">
      <div class="card">
        <div class="card-body">
          <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Membre (utilisateur)</label>
                <select class="form-select" formControlName="userId" [class.is-invalid]="invalid('userId')">
                  <option value="">Choisir un utilisateur...</option>
                  @for (u of users() ?? []; track u.id) {
                    <option [value]="u.id">{{ userLabel(u) }}</option>
                  }
                </select>
                <app-field-errors [formGroup]="form" controlName="userId" fieldLabel="Le membre" [serverErrors]="error?.validations"></app-field-errors>
              </div>
              <div class="col-md-6">
                <label class="form-label">Entité ecclésiale</label>
                <select class="form-select" formControlName="churchId" [class.is-invalid]="invalid('churchId')">
                  <option value="">Choisir une entité...</option>
                  @for (c of churches() ?? []; track c.id) {
                    <option [value]="c.id">{{ c.name }}</option>
                  }
                </select>
                <app-field-errors [formGroup]="form" controlName="churchId" fieldLabel="L'entité" [serverErrors]="error?.validations"></app-field-errors>
              </div>
              <div class="col-md-6">
                <label class="form-label">Fonction ecclésiale</label>
                <select class="form-select" formControlName="role" [class.is-invalid]="invalid('role')">
                  <option value="">Choisir une fonction...</option>
                  @for (r of roleList; track r) {
                    <option [value]="r">{{ roleLabels[r] }}</option>
                  }
                </select>
                <app-field-errors [formGroup]="form" controlName="role" fieldLabel="La fonction" [serverErrors]="error?.validations"></app-field-errors>
              </div>
              <div class="col-md-3">
                <label class="form-label">Début</label>
                <input type="date" class="form-control" formControlName="startDate" [class.is-invalid]="invalid('startDate')">
                <app-field-errors [formGroup]="form" controlName="startDate" fieldLabel="La date de début" [serverErrors]="error?.validations"></app-field-errors>
              </div>
              <div class="col-md-3">
                <label class="form-label">Fin <span class="text-muted">(optionnel)</span></label>
                <input type="date" class="form-control" formControlName="endDate">
              </div>
            </div>

            @if (error?.msg) {
              <div class="alert alert-danger mt-3 mb-0">
                <i class="fas fa-exclamation-triangle me-2"></i>{{ error?.msg }}
              </div>
            }

            <div class="d-flex gap-2 mt-4">
              <button type="submit" class="btn btn-primary" [disabled]="submitting()">
                @if (submitting()) { <span class="spinner-border spinner-border-sm me-2"></span> }
                Créer l'affectation
              </button>
              <a routerLink="/clergy-members" class="btn btn-outline-secondary">Annuler</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

</div>
