<div class="container-fluid px-0">

  <div class="page-header">
    <div class="d-flex align-items-center gap-3">
      <app-back-button fallback="/liturgy/schedules"></app-back-button>
      <div>
        <h1 class="page-title mb-0">Nouvel horaire liturgique</h1>
        <p class="page-subtitle mb-0">L'entité et le type ne pourront plus être modifiés après création.</p>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-8">
      <div class="card">
        <div class="card-body">
          <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Entité ecclésiale</label>
                <select class="form-select" formControlName="churchId" [class.is-invalid]="invalid('churchId')">
                  <option value="">Choisir une entité...</option>
                  @for (c of churches() ?? []; track c.id) { <option [value]="c.id">{{ c.name }}</option> }
                </select>
                <app-field-errors [formGroup]="form" controlName="churchId" fieldLabel="L'entité" [serverErrors]="error?.validations"></app-field-errors>
              </div>
              <div class="col-md-6">
                <label class="form-label">Type d'horaire</label>
                <select class="form-select" formControlName="typeId" [class.is-invalid]="invalid('typeId')">
                  <option value="">Choisir un type...</option>
                  @for (t of scheduleTypes; track t.id) { <option [value]="t.id">{{ t.name }}</option> }
                </select>
                <app-field-errors [formGroup]="form" controlName="typeId" fieldLabel="Le type" [serverErrors]="error?.validations"></app-field-errors>
                <div class="form-text">Types de scope « Horaire » (gérés dans Types).</div>
              </div>

              <div class="col-md-4">
                <label class="form-label">Fréquence</label>
                <select class="form-select" formControlName="frequency" [class.is-invalid]="invalid('frequency')">
                  <option value="">Choisir...</option>
                  @for (f of frequencyList; track f) { <option [value]="f">{{ frequencyLabels[f] }}</option> }
                </select>
                <app-field-errors [formGroup]="form" controlName="frequency" fieldLabel="La fréquence" [serverErrors]="error?.validations"></app-field-errors>
              </div>

              @if (needsDayOfWeek) {
                <div class="col-md-4">
                  <label class="form-label">Jour de la semaine</label>
                  <select class="form-select" formControlName="dayOfWeek">
                    <option value="">Choisir...</option>
                    @for (d of dayLabels; track $index) { <option [value]="$index">{{ d }}</option> }
                  </select>
                </div>
              }

              @if (needsWeekOfMonth) {
                <div class="col-md-4">
                  <label class="form-label">Semaine du mois</label>
                  <select class="form-select" formControlName="weekOfMonth">
                    <option value="">Choisir...</option>
                    @for (w of weekList; track w) { <option [value]="w">{{ w }}ᵉ</option> }
                  </select>
                </div>
              }

              <div class="col-md-4">
                <label class="form-label">Heure</label>
                <input type="time" class="form-control" formControlName="time" [class.is-invalid]="invalid('time')">
                <app-field-errors [formGroup]="form" controlName="time" fieldLabel="L'heure" [serverErrors]="error?.validations"></app-field-errors>
              </div>
              <div class="col-md-4">
                <label class="form-label">Durée (minutes)</label>
                <input type="number" min="1" class="form-control" formControlName="duration" [class.is-invalid]="invalid('duration')">
                <app-field-errors [formGroup]="form" controlName="duration" fieldLabel="La durée" [serverErrors]="error?.validations"></app-field-errors>
              </div>
              <div class="col-md-4">
                <label class="form-label">Langue <span class="text-muted">(optionnel)</span></label>
                <input type="text" class="form-control" formControlName="language" maxlength="10" placeholder="fr">
              </div>

              <div class="col-md-4">
                <label class="form-label">Temps liturgique</label>
                <select class="form-select" formControlName="season">
                  @for (s of seasonList; track s) { <option [value]="s">{{ seasonLabels[s] }}</option> }
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label">
                  {{ needsStartDate ? 'Date de la célébration' : 'Début de validité' }}
                  @if (!needsStartDate) { <span class="text-muted">(optionnel)</span> }
                </label>
                <input type="date" class="form-control" formControlName="startDate">
              </div>
              <div class="col-md-4">
                <label class="form-label">Fin de validité <span class="text-muted">(optionnel)</span></label>
                <input type="date" class="form-control" formControlName="endDate">
              </div>
            </div>

            @if (error?.msg) {
              <div class="alert alert-danger mt-3 mb-0"><i class="fas fa-exclamation-triangle me-2"></i>{{ error?.msg }}</div>
            }

            <div class="d-flex gap-2 mt-4">
              <button type="submit" class="btn btn-primary" [disabled]="submitting()">
                @if (submitting()) { <span class="spinner-border spinner-border-sm me-2"></span> }
                Créer l'horaire
              </button>
              <a routerLink="/liturgy/schedules" class="btn btn-outline-secondary">Annuler</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

</div>
