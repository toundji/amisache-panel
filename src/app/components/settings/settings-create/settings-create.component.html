<div class="container-fluid px-0">

  <div class="page-header">
    <div class="d-flex align-items-center gap-3">
      <app-back-button fallback="/settings"></app-back-button>
      <div>
        <h1 class="page-title mb-0">Nouveau setting</h1>
        <p class="page-subtitle mb-0">La clé doit être en MAJUSCULES avec underscores (ex. APP_NAME)</p>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-8">
      <div class="card">
        <div class="card-body">
          <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

            <div class="mb-3">
              <label class="form-label">Clé</label>
              <input type="text" class="form-control text-uppercase" formControlName="key"
                [class.is-invalid]="invalid('key')" placeholder="APP_MAINTENANCE_MODE">
              <app-field-errors [formGroup]="form" controlName="key" fieldLabel="La clé" [serverErrors]="error?.validations"></app-field-errors>
            </div>

            <div class="row g-3">
              <div class="col-md-8">
                <label class="form-label">Valeur</label>
                <input type="text" class="form-control" formControlName="value">
                <app-field-errors [formGroup]="form" controlName="value" fieldLabel="La valeur" [serverErrors]="error?.validations"></app-field-errors>
              </div>
              <div class="col-md-4">
                <label class="form-label">Type</label>
                <select class="form-select" formControlName="type">
                  @for (t of typeList; track t) {
                    <option [value]="t">{{ typeLabels[t] }}</option>
                  }
                </select>
              </div>
            </div>

            <div class="row g-3 mt-0">
              <div class="col-md-6">
                <label class="form-label">Libellé</label>
                <input type="text" class="form-control" formControlName="label" placeholder="Nom affiché dans le panel">
              </div>
              <div class="col-md-6">
                <label class="form-label">Catégorie</label>
                <input type="text" class="form-control" formControlName="category" placeholder="general, mail, payment...">
              </div>
            </div>

            <div class="mb-3 mt-3">
              <label class="form-label">Description</label>
              <textarea class="form-control" rows="3" formControlName="description"></textarea>
            </div>

            <div class="d-flex gap-4 mt-3">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="settingIsPublic" formControlName="isPublic">
                <label class="form-check-label" for="settingIsPublic">Public (exposé sans authentification)</label>
              </div>
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="settingIsEditable" formControlName="isEditable">
                <label class="form-check-label" for="settingIsEditable">Éditable (sinon, constante protégée)</label>
              </div>
            </div>

            @if (error?.msg) {
              <div class="alert alert-danger mt-3 mb-0">
                <i class="fas fa-exclamation-triangle me-2"></i>{{ error?.msg }}
              </div>
            }

            <div class="d-flex gap-2 mt-4">
              <button type="submit" class="btn btn-primary" [disabled]="submitting()">
                @if (submitting()) { <span class="spinner-border spinner-border-sm me-2"></span> }
                Créer le setting
              </button>
              <a routerLink="/settings" class="btn btn-outline-secondary">Annuler</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

</div>
