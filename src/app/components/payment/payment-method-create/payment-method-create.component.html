<div class="container-fluid px-0">

  <div class="page-header">
    <div class="d-flex align-items-center gap-3">
      <app-back-button fallback="/payment/methods"></app-back-button>
      <div>
        <h1 class="page-title mb-0">Nouveau moyen de paiement</h1>
        <p class="page-subtitle mb-0">L'entité ne pourra plus être modifiée après création.</p>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-8">
      <div class="card">
        <div class="card-body">
          <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Entité ecclésiale</label>
                <select class="form-select" formControlName="churchId" [class.is-invalid]="invalid('churchId')">
                  <option value="">Choisir une entité...</option>
                  @for (c of churches() ?? []; track c.id) { <option [value]="c.id">{{ c.name }}</option> }
                </select>
                <app-field-errors [formGroup]="form" controlName="churchId" fieldLabel="L'entité" [serverErrors]="error?.validations"></app-field-errors>
              </div>
              <div class="col-md-6">
                <label class="form-label">Opérateur</label>
                <select class="form-select" formControlName="operator" [class.is-invalid]="invalid('operator')">
                  <option value="">Choisir un opérateur...</option>
                  @for (o of operatorList; track o) { <option [value]="o">{{ operatorLabels[o] }}</option> }
                </select>
                <app-field-errors [formGroup]="form" controlName="operator" fieldLabel="L'opérateur" [serverErrors]="error?.validations"></app-field-errors>
              </div>
              <div class="col-md-6">
                <label class="form-label">Numéro de téléphone</label>
                <input type="text" class="form-control" formControlName="phone" [class.is-invalid]="invalid('phone')" placeholder="+229 ...">
                <app-field-errors [formGroup]="form" controlName="phone" fieldLabel="Le numéro" [serverErrors]="error?.validations"></app-field-errors>
                <div class="form-text">Format international attendu par l'API.</div>
              </div>
              <div class="col-md-6">
                <label class="form-label">Nom du compte</label>
                <input type="text" class="form-control" formControlName="accountName" maxlength="160" [class.is-invalid]="invalid('accountName')">
                <app-field-errors [formGroup]="form" controlName="accountName" fieldLabel="Le nom du compte" [serverErrors]="error?.validations"></app-field-errors>
              </div>
            </div>

            @if (error?.msg) {
              <div class="alert alert-danger mt-3 mb-0"><i class="fas fa-exclamation-triangle me-2"></i>{{ error?.msg }}</div>
            }

            <div class="d-flex gap-2 mt-4">
              <button type="submit" class="btn btn-primary" [disabled]="submitting()">
                @if (submitting()) { <span class="spinner-border spinner-border-sm me-2"></span> }
                Publier le moyen de paiement
              </button>
              <a routerLink="/payment/methods" class="btn btn-outline-secondary">Annuler</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

</div>
