<div class="container-fluid px-0">

  <div class="page-header">
    <div class="d-flex align-items-center gap-3">
      <app-back-button fallback="/users"></app-back-button>
      <div>
        <h1 class="page-title mb-0">Nouvel utilisateur</h1>
        <p class="page-subtitle mb-0">Créé en statut « non vérifié », rôle « user » — à ajuster ensuite</p>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-6">
      <div class="card">
        <div class="card-body">
          <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Prénom</label>
                <input type="text" class="form-control" formControlName="firstName">
              </div>
              <div class="col-md-6">
                <label class="form-label">Nom</label>
                <input type="text" class="form-control" formControlName="lastName">
              </div>
            </div>

            <div class="mt-3">
              <label class="form-label">Adresse email</label>
              <input type="email" class="form-control" formControlName="email"
                [class.is-invalid]="invalid('email')" placeholder="vous@exemple.com" autocomplete="email">
              <app-field-errors [formGroup]="form" controlName="email" fieldLabel="L'email" [serverErrors]="error?.validations"></app-field-errors>
            </div>

            <div class="mt-3">
              <label class="form-label">Mot de passe</label>
              <input type="password" class="form-control" formControlName="password"
                [class.is-invalid]="invalid('password')" placeholder="Min. 8 caractères" autocomplete="new-password">
              <app-field-errors [formGroup]="form" controlName="password" fieldLabel="Le mot de passe" [serverErrors]="error?.validations"></app-field-errors>
            </div>

            @if (error?.msg) {
              <div class="alert alert-danger mt-3 mb-0">
                <i class="fas fa-exclamation-triangle me-2"></i>{{ error?.msg }}
              </div>
            }

            <div class="d-flex gap-2 mt-4">
              <button type="submit" class="btn btn-primary" [disabled]="submitting()">
                @if (submitting()) { <span class="spinner-border spinner-border-sm me-2"></span> }
                Créer l'utilisateur
              </button>
              <a routerLink="/users" class="btn btn-outline-secondary">Annuler</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

</div>
