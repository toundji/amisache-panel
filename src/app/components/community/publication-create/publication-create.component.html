<div class="container-fluid px-0">

  <div class="page-header">
    <div class="d-flex align-items-center gap-3">
      <app-back-button fallback="/community/publications"></app-back-button>
      <div>
        <h1 class="page-title mb-0">Nouvelle publication</h1>
        <p class="page-subtitle mb-0">Créée en brouillon. L'entité, le groupe et le type sont fixés à la création.</p>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-9">
      <div class="card">
        <div class="card-body">
          <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label">Entité ecclésiale</label>
                <select class="form-select" formControlName="churchId" [class.is-invalid]="invalid('churchId')">
                  <option value="">Choisir une entité...</option>
                  @for (c of churches() ?? []; track c.id) { <option [value]="c.id">{{ c.name }}</option> }
                </select>
                <app-field-errors [formGroup]="form" controlName="churchId" fieldLabel="L'entité" [serverErrors]="error?.validations"></app-field-errors>
              </div>
              <div class="col-md-4">
                <label class="form-label">Type de publication</label>
                <select class="form-select" formControlName="typeId" [class.is-invalid]="invalid('typeId')">
                  <option value="">Choisir un type...</option>
                  @for (t of publicationTypes; track t.id) { <option [value]="t.id">{{ t.name }}</option> }
                </select>
                <app-field-errors [formGroup]="form" controlName="typeId" fieldLabel="Le type" [serverErrors]="error?.validations"></app-field-errors>
                <div class="form-text">Types de scope « Publication » (gérés dans Types).</div>
              </div>
              <div class="col-md-4">
                <label class="form-label">Groupe auteur <span class="text-muted">(optionnel)</span></label>
                <select class="form-select" formControlName="groupId" [disabled]="!form.get('churchId')?.value">
                  <option value="">Aucun (fil de l'église)</option>
                  @for (g of groupsForChurch(); track g.id) { <option [value]="g.id">{{ g.name }}</option> }
                </select>
              </div>

              <div class="col-12">
                <label class="form-label">Titre</label>
                <input type="text" class="form-control" formControlName="title" maxlength="200" [class.is-invalid]="invalid('title')">
                <app-field-errors [formGroup]="form" controlName="title" fieldLabel="Le titre" [serverErrors]="error?.validations"></app-field-errors>
              </div>
              <div class="col-12">
                <label class="form-label">Contenu</label>
                <textarea class="form-control" rows="8" formControlName="content" [class.is-invalid]="invalid('content')"></textarea>
                <app-field-errors [formGroup]="form" controlName="content" fieldLabel="Le contenu" [serverErrors]="error?.validations"></app-field-errors>
              </div>

              <div class="col-md-4">
                <label class="form-label">Début d'affichage <span class="text-muted">(optionnel)</span></label>
                <input type="date" class="form-control" formControlName="startDate">
              </div>
              <div class="col-md-4">
                <label class="form-label">Fin d'affichage <span class="text-muted">(optionnel)</span></label>
                <input type="date" class="form-control" formControlName="endDate">
              </div>
            </div>

            @if (error?.msg) {
              <div class="alert alert-danger mt-3 mb-0"><i class="fas fa-exclamation-triangle me-2"></i>{{ error?.msg }}</div>
            }

            <div class="d-flex gap-2 mt-4">
              <button type="submit" class="btn btn-primary" [disabled]="submitting()">
                @if (submitting()) { <span class="spinner-border spinner-border-sm me-2"></span> }
                Créer la publication
              </button>
              <a routerLink="/community/publications" class="btn btn-outline-secondary">Annuler</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

</div>
