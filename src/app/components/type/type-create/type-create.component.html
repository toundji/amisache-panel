<div class="container-fluid px-0">

  <div class="page-header">
    <div class="d-flex align-items-center gap-3">
      <app-back-button fallback="/types"></app-back-button>
      <div>
        <h1 class="page-title mb-0">Nouveau type</h1>
        <p class="page-subtitle mb-0">Le scope détermine dans quel sélecteur métier ce type apparaîtra</p>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-8">
      <div class="card">
        <div class="card-body">
          <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

            <div class="row g-3">
              <div class="col-md-7">
                <label class="form-label">Nom</label>
                <input type="text" class="form-control" formControlName="name" maxlength="120"
                  [class.is-invalid]="invalid('name')" placeholder="Action de grâce">
                <app-field-errors [formGroup]="form" controlName="name" fieldLabel="Le nom" [serverErrors]="error?.validations"></app-field-errors>
              </div>
              <div class="col-md-5">
                <label class="form-label">Scope</label>
                <select class="form-select" formControlName="scope" [class.is-invalid]="invalid('scope')">
                  <option value="">Choisir un scope...</option>
                  @for (s of scopeList; track s) {
                    <option [value]="s">{{ scopeLabels[s] }}</option>
                  }
                </select>
                <app-field-errors [formGroup]="form" controlName="scope" fieldLabel="Le scope" [serverErrors]="error?.validations"></app-field-errors>
              </div>
            </div>

            @if (isRequestScope()) {
              <hr class="my-4">
              <h2 class="h6 mb-3">Règles de demande</h2>
              <div class="row g-3">
                <div class="col-md-5">
                  <label class="form-label">Délai minimum avant la date souhaitée</label>
                  <div class="input-group">
                    <input type="number" class="form-control" formControlName="minLeadDays" min="0">
                    <span class="input-group-text">jour(s)</span>
                  </div>
                  <app-field-errors [formGroup]="form" controlName="minLeadDays" fieldLabel="Le délai" [serverErrors]="error?.validations"></app-field-errors>
                </div>
                <div class="col-md-7 d-flex flex-column gap-2 justify-content-center">
                  <div class="form-check form-switch">
                    <input type="checkbox" class="form-check-input" id="allowHomeCelebration" formControlName="allowHomeCelebration">
                    <label class="form-check-label" for="allowHomeCelebration">Peut être célébré à domicile</label>
                  </div>
                  <div class="form-check form-switch">
                    <input type="checkbox" class="form-check-input" id="requiresScheduleMatch" formControlName="requiresScheduleMatch">
                    <label class="form-check-label" for="requiresScheduleMatch">La date doit correspondre à un horaire publié</label>
                  </div>
                </div>
              </div>
            }

            @if (error?.msg) {
              <div class="alert alert-danger mt-3 mb-0">
                <i class="fas fa-exclamation-triangle me-2"></i>{{ error?.msg }}
              </div>
            }

            <div class="d-flex gap-2 mt-4">
              <button type="submit" class="btn btn-primary" [disabled]="submitting()">
                @if (submitting()) { <span class="spinner-border spinner-border-sm me-2"></span> }
                Créer le type
              </button>
              <a routerLink="/types" class="btn btn-outline-secondary">Annuler</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

</div>
