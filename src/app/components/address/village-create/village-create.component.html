<div class="container-fluid px-0">

  <div class="page-header">
    <div class="d-flex align-items-center gap-3">
      <app-back-button fallback="/geo/villages"></app-back-button>
      <div>
        <h1 class="page-title mb-0">Nouveau village / quartier</h1>
        <p class="page-subtitle mb-0">La zone de rattachement ne pourra plus être modifiée après création</p>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-8">
      <div class="card">
        <div class="card-body">
          <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Nom</label>
                <input type="text" class="form-control" formControlName="name" maxlength="120"
                  [class.is-invalid]="invalid('name')" placeholder="Ganhi">
                <app-field-errors [formGroup]="form" controlName="name" fieldLabel="Le nom" [serverErrors]="error?.validations"></app-field-errors>
              </div>
              <div class="col-md-3">
                <label class="form-label">Type</label>
                <select class="form-select" formControlName="type" [class.is-invalid]="invalid('type')">
                  @for (t of typeList; track t) {
                    <option [value]="t">{{ typeLabels[t] }}</option>
                  }
                </select>
                <app-field-errors [formGroup]="form" controlName="type" fieldLabel="Le type" [serverErrors]="error?.validations"></app-field-errors>
              </div>
              <div class="col-md-3">
                <label class="form-label">Zone</label>
                <select class="form-select" formControlName="zoneId" [class.is-invalid]="invalid('zoneId')">
                  <option value="">Choisir...</option>
                  @for (z of zones() ?? []; track z.id) {
                    <option [value]="z.id">{{ z.name }}</option>
                  }
                </select>
                <app-field-errors [formGroup]="form" controlName="zoneId" fieldLabel="La zone" [serverErrors]="error?.validations"></app-field-errors>
              </div>
            </div>

            <div class="mb-3 mt-3">
              <label class="form-label">Niveau administratif sauté <span class="text-muted">(optionnel)</span></label>
              <input type="text" class="form-control" formControlName="parentSub" maxlength="120"
                placeholder="Ex. un niveau réel entre la zone et ce village, s'il existe">
              <app-field-errors [formGroup]="form" controlName="parentSub" fieldLabel="Le niveau sauté" [serverErrors]="error?.validations"></app-field-errors>
            </div>

            @if (error?.msg) {
              <div class="alert alert-danger mt-3 mb-0">
                <i class="fas fa-exclamation-triangle me-2"></i>{{ error?.msg }}
              </div>
            }

            <div class="d-flex gap-2 mt-4">
              <button type="submit" class="btn btn-primary" [disabled]="submitting()">
                @if (submitting()) { <span class="spinner-border spinner-border-sm me-2"></span> }
                Créer
              </button>
              <a routerLink="/geo/villages" class="btn btn-outline-secondary">Annuler</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

</div>
